# Mantiene activo el proyecto de Supabase (plan gratis): si no tiene actividad
# durante varios días, Supabase lo pausa. Esta tarea consulta la biblioteca de
# ejercicios cada 3 días, igual que lo hace la app.
#
# Sólo usa la URL y la clave PÚBLICA (publishable), las mismas que ya van en la
# app del navegador. Nunca poner acá la secret / service role key.
#
# GitHub sólo corre tareas programadas desde la rama principal (main).
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 12 */3 * *' # cada 3 días, 12:17 UTC (9:17 en Argentina)
  workflow_dispatch: # para correrla a mano desde la pestaña Actions

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://ratkrlqzylsljgbzrmli.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_cfdw9zNcMAaHWceg9CTC8Q_dhlC0iTq
    steps:
      - name: Consultar la biblioteca de ejercicios
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/exercises?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY"
          echo
          echo "Supabase respondió bien."
